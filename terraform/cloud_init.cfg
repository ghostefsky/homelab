#cloud-config
# Конфигурация первичной инициализации VM

hostname: ${hostname}
fqdn: ${hostname}.local
timezone: Europe/Moscow

# Создаём пользователя
users:
  - name: yakovlev
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo, users
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_public_key}

# Обновляем пакеты и устанавливаем базовые утилиты при первом старте
package_update: true
packages:
  - qemu-guest-agent
  - curl
  - wget
  - git

# Включаем и запускаем qemu-guest-agent (чтобы libvirt видел IP-адрес VM)
runcmd:
  - systemctl enable --now qemu-guest-agent
