---
- name: 🛠 Базовая подготовка узлов под Kubernetes
  hosts: k8s_cluster
  become: true # Запускать все задачи с правами sudo (root)

  tasks:
    # --- 1. HOSTNAME ---
    - name: 1. Установка корректного Hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    # --- 2. ОБНОВЛЕНИЕ ПАКЕТОВ И УСТАНОВКА УТИЛИТ ---
    - name: 2. Обновление apt-кэша и установка базовых утилит
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - htop
          - net-tools
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - bridge-utils
        state: present
        update_cache: true

    # --- 3. ОТКЛЮЧЕНИЕ SWAP (ОБЯЗАТЕЛЬНО ДЛЯ K8S) ---
    - name: 3.1 Отключение SWAP в текущей сессии
      ansible.builtin.command: swapoff -a
      when: ansible_swaptargets | default([]) | length > 0
      changed_when: false

    - name: 3.2 Отключение SWAP в /etc/fstab (чтобы не включился после перезагрузки)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    # --- 4. МОДУЛИ ЯДРА LINUX ДЛЯ CONTAINERD / K8S ---
    - name: 4.1 Создание конфига для загрузки модулей ядра
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: 4.2 Загрузка модуля overlay
      community.general.modprobe:
        name: overlay
        state: present
      ignore_errors: true # Если модуля нет в pip-коллекции, ниже вызовем команду вручную

    - name: 4.3 Принудительная загрузка модулей через modprobe
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    # --- 5. СЕТЕВЫЕ НАСТРОЙКИ SYSCTL ДЛЯ K8S ---
    - name: 5.1 Конфигурация sysctl для трафика контейнеров
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: 5.2 Применение параметров sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false

    # --- 6. ПРОВЕРКА ЧАСОВОГО ПОЯСА ---
    - name: 6. Установка часового пояса (Timezone)
      community.general.timezone:
        name: Europe/Moscow
      ignore_errors: true

