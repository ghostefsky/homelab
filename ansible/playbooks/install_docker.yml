---
- name: 🐳 Установка Docker CE
  hosts: k8s_cluster
  become: true # Нужны права root

  tasks:
    - name: 1. Установка необходимых зависимостей
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: 2. Создание директории для GPG ключей
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 3. Скачивание официального GPG ключа Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: 4. Добавление репозитория Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: 5. Установка Docker CE, Containerd и Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: 6. Включение и запуск службы Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: 7. Добавление пользователя yakovlev в группу docker
      ansible.builtin.user:
        name: yakovlev
        groups: docker
        append: true
      # Пользователь сможет выполнять команды docker без sudo (применится при следующем входе)
